[project]
name = "brief-news"
version = "4.0.0"
description = "Lightweight news, stocks & football aggregator — Starlette + stdlib XML, optimized for low-RAM servers"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.45.0",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "truststore>=0.9",
]

[project.optional-dependencies]
# Install these only if you have RAM to spare
extras = [
    "trafilatura>=2.0.0",         # better article extraction (~30MB)
    "googlenewsdecoder>=0.1.7",   # resolve Google News redirect URLs (~5MB)
]
